services:
  inked:
    build: .
    ports:
      # Host port is configurable: INKED_PORT=9000 docker compose up -d
      - "${INKED_PORT:-8088}:8080"
    volumes:
      # On Linux the container runs as uid 1000 (user "node"); make sure ./data is writable by it,
      # e.g. `mkdir -p data && sudo chown 1000:1000 data`.
      - ./data:/data
    environment:
      # Set to "true" when Inked is served over HTTPS (e.g. behind a TLS reverse proxy).
      COOKIE_SECURE: "false"
      # Behind a reverse proxy (Traefik, Caddy, nginx) set this to the number of proxy hops (usually 1)
      # or the proxy's IP/CIDR, so login lockouts apply per real client IP. Leave unset when exposed directly.
      # TRUST_PROXY: "1"
    restart: unless-stopped
