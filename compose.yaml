# Inked behind nginx on the external cloudflared-net network. No host ports are published.
# Deploy guide: docs/deploy.md.
# Local testing ONLY (never on the production host): docker compose -p inked-test -f compose.yaml -f compose.local.yaml up -d --build
# Project name pins the data volume to "inked_inked-data"; the test project gets its own "inked-test_inked-data".
name: inked
services:
  inked:
    build:
      context: .
      args:
        INKED_SEMANTIC: ${INKED_SEMANTIC:-1}
    restart: unless-stopped
    volumes:
      # Named volume: Docker seeds it with the image's /data ownership (uid 1000, "node"), so no chown is needed.
      - inked-data:/data
    environment:
      COOKIE_SECURE: "true"
      # Only nginx on the private network may set the client IP (it forwards Cloudflare's CF-Connecting-IP).
      TRUST_PROXY: "172.31.250.0/28"
    networks:
      - inked-internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      inked:
        condition: service_healthy
    environment:
      # Subnet of cloudflared-net; see .env.example for how to look it up.
      CLOUDFLARED_NET_CIDR: ${CLOUDFLARED_NET_CIDR:-172.16.0.0/12}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # Blank out the image's default server, which would otherwise answer first on :80.
      - ./deploy/nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      inked-internal: {}
      cloudflared-net:
        aliases:
          - inked-nginx

volumes:
  inked-data: {}

networks:
  inked-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28
  cloudflared-net:
    external: true
